<!DOCTYPE html>
<html lang="ko" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>Spectrum</title>
  <style>
    :root {
      /* 브라우저 탭에서는 주소창/툴바가 이미 그 공간을 쓰므로 0.
         홈 화면 실행일 때만 실제 안전영역 값을 넣는다. */
      --sa-top: 0px;
      --sa-bottom: 0px;

      --bg-main: #000000;
      --text-main: #ffffff;
      --text-dim: #8e8e93;

      --wave-track-bg: rgba(255, 255, 255, 0.06);
      --wave-track-border: rgba(255, 255, 255, 0.1);
      --wave-bar-active: linear-gradient(180deg, #ffffff 0%, #a0a0a5 100%);
      --wave-bar-active-glow: rgba(255, 255, 255, 0.35);
      --wave-bar-idle: rgba(255, 255, 255, 0.15);

      --calc-display: #ffffff;
      --calc-key-dark: #2c2c2e;
      --calc-key-dark-text: #ffffff;
      --calc-key-gray: #a5a5a5;
      --calc-key-gray-text: #000000;
      --calc-key-orange: #ff9f0a;

      --notes-bg: #000000;
      --notes-text: #ffffff;
      --notes-yellow: #f1a80a;
      --notes-icon-bg: #1c1c1e;
      --notes-icon-color: #ffffff;
      --notes-share-color: #98989d;
      --notes-caret: #f1a80a;

      --panel-bg: rgba(30, 30, 30, 0.88);
      --panel-border: rgba(255, 255, 255, 0.15);
      --panel-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      --chip-bg: rgba(120, 120, 128, 0.24);
    }

    @media (display-mode: standalone), (display-mode: fullscreen) {
      :root { --sa-top: env(safe-area-inset-top); --sa-bottom: env(safe-area-inset-bottom); }
    }
    html.is-standalone { --sa-top: env(safe-area-inset-top); --sa-bottom: env(safe-area-inset-bottom); }

    [data-rendered-theme="light"] {
      --bg-main: #f2f2f7;
      --text-main: #000000;
      --text-dim: #6d6d72;

      --wave-track-bg: rgba(0, 0, 0, 0.04);
      --wave-track-border: rgba(0, 0, 0, 0.08);
      --wave-bar-active: linear-gradient(180deg, #1c1c1e 0%, #636366 100%);
      --wave-bar-active-glow: rgba(0, 0, 0, 0.15);
      --wave-bar-idle: rgba(0, 0, 0, 0.12);

      --calc-display: #000000;
      --calc-key-dark: #e5e5ea;
      --calc-key-dark-text: #000000;
      --calc-key-gray: #d4d4d9;
      --calc-key-gray-text: #000000;
      --calc-key-orange: #ff9f0a;

      --notes-bg: #ffffff;
      --notes-text: #000000;
      --notes-yellow: #e4a817;
      --notes-icon-bg: #e5e5ea;
      --notes-icon-color: #000000;
      --notes-share-color: #636366;
      --notes-caret: #e4a817;

      --panel-bg: rgba(240, 240, 245, 0.94);
      --panel-border: rgba(0, 0, 0, 0.12);
      --panel-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      --chip-bg: rgba(120, 120, 128, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--calc-key-orange);
      outline-offset: 2px;
    }

    /* ---------- 설정 ---------- */
    .settings-toggle-btn {
      position: fixed;
      /* 계산기 스킨에서는 오른쪽 위 아이콘과 정확히 겹쳐 놓는다.
         투명 처리돼 있으므로 그 자리를 눌러 설정을 연다. */
      top: var(--sa-top);
      right: 14px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(120, 120, 128, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      cursor: pointer;
      opacity: 0.35;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .settings-toggle-btn:active { transform: scale(0.92); opacity: 1; }

    .settings-modal {
      position: fixed;
      top: calc(var(--sa-top) + 54px);
      right: 16px;
      width: 268px;
      background: var(--panel-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 14px 16px;
      z-index: 99998;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--panel-shadow);
      color: var(--text-main);
    }

    .settings-modal.active { display: flex; }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settings-row.stack {
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }

    .settings-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .switcher-group { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

    .skin-btn {
      background: var(--chip-bg);
      border: none;
      color: var(--text-main);
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
    }

    .skin-btn.active { background: var(--notes-yellow); color: #ffffff; }

    /* 도구 이동 버튼은 한 줄에 꽉 차게 */
    .settings-row.stack .switcher-group { flex-wrap: nowrap; justify-content: stretch; }
    .settings-row.stack .skin-btn { flex: 1; padding: 9px 10px; text-align: center; }

    .settings-divider { height: 1px; background: var(--panel-border); }

    .rehearsal {
      font-size: 12px;
      line-height: 1.6;
      color: var(--text-main);
      background: var(--chip-bg);
      border-radius: 12px;
      padding: 10px 12px;
      display: none;
    }
    .rehearsal.active { display: block; }
    .rehearsal .r-label { color: var(--text-dim); font-weight: 600; }
    .rehearsal .r-seq { font-variant-numeric: tabular-nums; letter-spacing: 0.5px; word-break: break-word; }
    .rehearsal .r-ok { color: #30d158; font-weight: 700; }
    .rehearsal .r-bad { color: #ff453a; font-weight: 700; }

    /* ---------- 비밀 탭 영역 ---------- */
    /* 홈 인디케이터 위로 띄워서 바닥 스와이프 영역과 겹치지 않게 한다 */
    .tap-zone {
      position: fixed;
      bottom: calc(var(--sa-bottom) + 10px);
      width: 84px;
      height: 84px;
      z-index: 90;
      display: none;
      background: transparent;
      border: none;
    }
    .tap-zone.on { display: block; }
    #tapTens { left: 0; }
    #tapOnes { right: 0; }

    /* ---------- 화면 ---------- */
    .screen {
      /* vh/dvh 대신 fixed inset:0 — iOS 홈 화면 실행에서 높이가 짧게 잡혀
         하단에 빈 띠가 생기는 것을 막는다 */
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      overflow: hidden;
    }

    .screen.active { display: flex; }

    /* 1. 파동 */
    #skin-wave {
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(var(--sa-top) + 60px) 20px calc(var(--sa-bottom) + 30px);
    }

    .wave-header {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 10px;
    }

    .eq-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex: 1;
      width: 100%;
      max-width: 360px;
      padding: 24px 0;
    }

    .eq-bar-wrapper {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eq-bar-track {
      width: 100%;
      max-width: 28px;
      height: 100%;
      max-height: 260px;
      background: var(--wave-track-bg);
      border: 1px solid var(--wave-track-border);
      border-radius: 20px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      overflow: hidden;
    }

    .eq-bar-fill {
      width: 100%;
      border-radius: 14px;
      height: 20%;
      background: var(--wave-bar-idle);
      transition: height 0.5s cubic-bezier(0.16, 1, 0.3, 1), background 0.3s ease;
    }

    .eq-bar-wrapper[data-bit="1"] .eq-bar-fill {
      height: 82%;
      background: var(--wave-bar-active);
      box-shadow: 0 0 16px var(--wave-bar-active-glow);
      animation: wavePulse1 1.8s infinite ease-in-out alternate;
    }

    .eq-bar-wrapper[data-bit="0"] .eq-bar-fill {
      animation: wavePulse0 2.4s infinite ease-in-out alternate;
    }

    /* 값이 없을 때: 0000과 구분되는 중간 높이의 무의미한 흐름 */
    .eq-bar-wrapper[data-bit="idle"] .eq-bar-fill {
      height: 45%;
      background: var(--wave-bar-idle);
      animation: waveIdle 2.2s infinite ease-in-out alternate;
    }

    @keyframes wavePulse1 { 0% { height: 75%; opacity: 0.85; } 100% { height: 92%; opacity: 1; } }
    @keyframes wavePulse0 { 0% { height: 16%; opacity: 0.5; } 100% { height: 24%; opacity: 0.8; } }
    @keyframes waveIdle { 0% { height: 34%; opacity: 0.45; } 100% { height: 58%; opacity: 0.75; } }

    .wave-form {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(120, 120, 128, 0.12);
      padding: 10px 18px;
      border-radius: 24px;
      border: 1px solid rgba(120, 120, 128, 0.2);
      transition: opacity 0.4s ease;
    }

    .wave-form.dim { opacity: 0.1; }

    .wave-input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 19px;
      font-weight: 600;
      width: 64px;
      text-align: center;
      outline: none;
      user-select: auto;
      -webkit-user-select: auto;
    }

    .wave-submit-btn {
      background: rgba(120, 120, 128, 0.25);
      border: none;
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 2. 계산기 */
    #skin-calc {
      flex-direction: column;
      justify-content: flex-end;
      /* 실측: 마지막 버튼 행 아래로 62pt (안전영역 34 + 28) */
      padding: 0 16px calc(var(--sa-bottom) + 28px) 16px;
    }

    .calc-top-bar {
      position: absolute;
      top: var(--sa-top);
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .calc-icon-btn {
      /* 실측: 실제 앱의 원은 지름 44 */
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--calc-key-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--calc-key-dark-text);
      border: none;
      cursor: default;
    }

    .calc-display-container {
      width: 100%;
      padding: 0 12px 16px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .calc-display-text {
      font-size: 72px;
      font-weight: 300;
      color: var(--calc-display);
      line-height: 1.05;
      letter-spacing: -1px;
      white-space: nowrap;
      overflow-x: auto;
      max-width: 100%;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;               /* 실측 8.3 */
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .calc-key {
      aspect-ratio: 1;
      border-radius: 50%;
      border: none;
      font-size: 28px;
      font-weight: 400;
      color: var(--calc-key-dark-text);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .calc-key:active { filter: brightness(1.35); }
    .key-dark { background: var(--calc-key-dark); }
    .key-gray { background: var(--calc-key-gray); color: var(--calc-key-gray-text); }
    .key-orange { background: var(--calc-key-orange); color: #ffffff; font-size: 32px; }
    .key-orange.armed { background: #ffffff; color: var(--calc-key-orange); }

    .calc-key svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 3. 메모장 */
    #skin-notes {
      flex-direction: column;
      background: var(--notes-bg);
      padding-top: var(--sa-top);
      height: var(--vv-h, 100%);   /* 키보드가 올라오면 JS가 실제 보이는 높이로 줄인다 */
      overflow: hidden;
      padding-top: calc(var(--sa-top) + 44px);   /* 고정된 헤더 자리 */
      /* 메모 스킨은 스크롤이라는 개념 자체가 없어야 한다 */
      touch-action: none;
      overscroll-behavior: none;
    }
    #skin-notes .notes-textarea { touch-action: auto; }

    .notes-header {
      /* 상단 바는 절대 움직이지 않는다. iOS가 화면을 밀어 올려도
         --vv-shift 만큼 되돌려 제자리에 붙여둔다. */
      position: fixed;
      top: var(--sa-top);
      left: 0;
      right: 0;
      z-index: 30;
      background: var(--notes-bg);
      transform: translateY(var(--vv-shift, 0px));
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notes-back-btn, .notes-check-circle {
      /* 실측: 실제 앱의 원은 지름 44 */
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .notes-back-btn { background: var(--notes-icon-bg); }
    .notes-back-btn svg { stroke: var(--notes-icon-color); fill: none; }
    .notes-check-circle { background: var(--notes-yellow); }

    .notes-top-right { display: flex; align-items: center; gap: 10px; }

    .notes-action-pill {
      height: 44px;
      background: var(--notes-icon-bg);
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 18px;
    }

    .notes-pill-icon { display: flex; align-items: center; cursor: pointer; }
    .notes-pill-icon.share svg { stroke: var(--notes-share-color); fill: none; }
    .notes-pill-icon.more svg { fill: var(--notes-icon-color); }

    .notes-content-area { flex: 1 1 auto; min-height: 0; padding: 16px 20px; display: flex; flex-direction: column; }

    /* iOS 계산기 앱에는 라이트 모드가 없다. 흰 계산기는 그 자체로 위장이 깨지므로
       이 화면만은 테마와 무관하게 항상 다크로 고정한다. */
    [data-rendered-theme="light"] body[data-rendered-skin="calc"]{
      --bg-main: #000000;
      --calc-display: #ffffff;
      --calc-key-dark: #333333;
      --calc-key-dark-text: #ffffff;
      --calc-key-gray: #a5a5a5;
      --calc-key-gray-text: #000000;
      --calc-key-orange: #ff9f0a;
      --text-main: #ffffff;
      --text-dim: #8e8e93;
      --chip-bg: rgba(120,120,128,0.32);
    }

    /* 위장 스킨에서는 설정 버튼을 숨긴다(같은 자리를 눌러 여는 것은 그대로 동작) */
    body[data-rendered-skin="calc"] .settings-toggle-btn,
    body[data-rendered-skin="notes"] .settings-toggle-btn{
      opacity: 0; background: transparent; border-color: transparent;
    }

    .notes-textarea {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--notes-text);
      font-size: 22px;
      outline: none;
      resize: none;
      caret-color: var(--notes-caret);
      user-select: text;
      -webkit-user-select: text;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }
    /* iOS가 편집 중인 영역에 그리는 테두리 제거 (메모장에 없는 UI라 위장이 깨진다) */
    .notes-textarea:focus,
    .notes-textarea:focus-visible{ outline: none !important; border: none !important; box-shadow: none !important; }
    .notes-content-area:focus-within{ outline: none !important; }

  </style>
</head>
<body>

  <button class="settings-toggle-btn" id="settingsToggleBtn" aria-label="설정">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <div class="settings-modal" id="settingsModal">
    <div class="settings-row">
      <span class="settings-label">스킨</span>
      <div class="switcher-group" id="skinSelectors">
        <button class="skin-btn" data-skin="wave">파동</button>
        <button class="skin-btn" data-skin="calc">계산기</button>
        <button class="skin-btn" data-skin="notes">메모장</button>
      </div>
    </div>

    <div class="settings-row">
      <span class="settings-label">테마</span>
      <div class="switcher-group" id="themeSelectors">
        <button class="skin-btn" data-theme-mode="system">시스템</button>
        <button class="skin-btn" data-theme-mode="light">라이트</button>
        <button class="skin-btn" data-theme-mode="dark">다크</button>
      </div>
    </div>

    <div class="settings-row">
      <span class="settings-label">비밀 탭 입력</span>
      <div class="switcher-group" id="secretSelectors">
        <button class="skin-btn" data-secret="on">켬</button>
        <button class="skin-btn" data-secret="off">끔</button>
      </div>
    </div>

    <div class="settings-row">
      <span class="settings-label">리허설 정보</span>
      <div class="switcher-group" id="rehearsalSelectors">
        <button class="skin-btn" data-rehearsal="on">켬</button>
        <button class="skin-btn" data-rehearsal="off">끔</button>
      </div>
    </div>

    <div class="settings-divider"></div>

    <div class="settings-row stack">
      <span class="settings-label">도구</span>
      <div class="switcher-group">
        <button class="skin-btn" id="gotoAcaanBtn">ACAAN 계산기</button>
        <button class="skin-btn" id="gotoHomeBtn">선택 화면</button>
      </div>
    </div>

    <div class="settings-divider"></div>
    <div class="rehearsal" id="rehearsalPanel"></div>
  </div>

  <button class="tap-zone" id="tapTens" aria-hidden="true" tabindex="-1"></button>
  <button class="tap-zone" id="tapOnes" aria-hidden="true" tabindex="-1"></button>

  <!-- 1. 파동 -->
  <div id="skin-wave" class="screen">
    <div class="wave-header">Audio Spectrum</div>
    <div class="eq-container" id="eqMatrix"></div>
    <form class="wave-form" id="waveForm">
      <input type="number" id="waveInput" class="wave-input" inputmode="numeric" pattern="[0-9]*" min="1" max="52" placeholder="—" aria-label="위치">
      <button type="submit" class="wave-submit-btn">확인</button>
    </form>
  </div>

  <!-- 2. 계산기 -->
  <div id="skin-calc" class="screen">
    <div class="calc-top-bar">
      <button class="calc-icon-btn" tabindex="-1" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      </button>
      <button class="calc-icon-btn" tabindex="-1" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"></rect><line x1="8" y1="10" x2="16" y2="10"></line><line x1="8" y1="14" x2="16" y2="14"></line></svg>
      </button>
    </div>

    <div class="calc-display-container">
      <div class="calc-display-text" id="calcDisplay">0</div>
    </div>

    <div class="calc-grid" id="calcGrid">
      <button class="calc-key key-gray" data-calc="back">
        <svg viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg>
      </button>
      <button class="calc-key key-gray" data-calc="clear">AC</button>
      <button class="calc-key key-gray" data-calc="percent">%</button>
      <button class="calc-key key-orange" data-calc="op" data-val="÷">÷</button>

      <button class="calc-key key-dark" data-calc="num" data-val="7">7</button>
      <button class="calc-key key-dark" data-calc="num" data-val="8">8</button>
      <button class="calc-key key-dark" data-calc="num" data-val="9">9</button>
      <button class="calc-key key-orange" data-calc="op" data-val="×">×</button>

      <button class="calc-key key-dark" data-calc="num" data-val="4">4</button>
      <button class="calc-key key-dark" data-calc="num" data-val="5">5</button>
      <button class="calc-key key-dark" data-calc="num" data-val="6">6</button>
      <button class="calc-key key-orange" data-calc="op" data-val="−">−</button>

      <button class="calc-key key-dark" data-calc="num" data-val="1">1</button>
      <button class="calc-key key-dark" data-calc="num" data-val="2">2</button>
      <button class="calc-key key-dark" data-calc="num" data-val="3">3</button>
      <button class="calc-key key-orange" data-calc="op" data-val="+">+</button>

      <button class="calc-key key-dark" data-calc="sign">⁺∕₋</button>
      <button class="calc-key key-dark" data-calc="num" data-val="0">0</button>
      <button class="calc-key key-dark" data-calc="dot">.</button>
      <button class="calc-key key-orange" data-calc="equals" id="calcEqualsKey">=</button>
    </div>
  </div>

  <!-- 3. 메모장 -->
  <div id="skin-notes" class="screen">
    <div class="notes-header">
      <div class="notes-back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </div>
      <div class="notes-top-right">
        <div class="notes-action-pill">
          <div class="notes-pill-icon share">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
              <polyline points="16 6 12 2 8 6"></polyline>
              <line x1="12" y1="2" x2="12" y2="15"></line>
            </svg>
          </div>
          <div class="notes-pill-icon more">
            <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
          </div>
        </div>
        <div class="notes-check-circle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
      </div>
    </div>
    <div class="notes-content-area">
      <textarea id="notesInput" class="notes-textarea" spellcheck="false" aria-label="메모"></textarea>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    var BITS = 6;
    var MAX_N = 52;

    var store = {
      get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    };

    var state = {
      n: null,
      skin: store.get('skin', 'wave'),
      theme: store.get('theme', 'system'),
      secret: store.get('secret', 'on'),
      rehearsal: store.get('rehearsal', 'off'),
      tens: 0,
      ones: 0
    };

    var $ = function (id) { return document.getElementById(id); };

    /* ---------- 코어: 엘름슬리 파로 ---------- */
    // 맨 위 카드를 n번째로 보내는 시퀀스. (n-1)을 6자리 이진수로, 왼쪽부터 1 = 인패로, 0 = 아웃패로.
    function bitsOf(n) {
      if (!Number.isInteger(n) || n < 1 || n > MAX_N) return null;
      return (n - 1).toString(2).padStart(BITS, '0');
    }

    function faro(deck, isIn) {
      var h = deck.length / 2, A = deck.slice(0, h), B = deck.slice(h), out = [];
      for (var i = 0; i < h; i++) {
        if (isIn) { out.push(B[i], A[i]); } else { out.push(A[i], B[i]); }
      }
      return out;
    }

    // 시퀀스를 실제로 시뮬레이션해서 맨 위 카드가 n번째에 도착하는지 검증
    function verify(n) {
      var bits = bitsOf(n);
      if (!bits) return false;
      var deck = [];
      for (var i = 1; i <= MAX_N; i++) deck.push(i);
      for (var j = 0; j < bits.length; j++) deck = faro(deck, bits[j] === '1');
      return deck.indexOf(1) + 1 === n;
    }

    /* ---------- 상태 ---------- */
    function setN(v) {
      state.n = (Number.isInteger(v) && v >= 1 && v <= MAX_N) ? v : null;
      renderWave();
      renderRehearsal();
    }

    /* ---------- 테마 ---------- */
    // 구형 WebView에는 matchMedia가 없다. 없으면 예외로 스크립트 전체가 죽어 화면이 백지가 된다.
    var mq = (typeof window.matchMedia === 'function')
      ? window.matchMedia('(prefers-color-scheme: dark)')
      : { matches: true, addEventListener: null, addListener: null };

    function applyTheme() {
      var eff = state.theme === 'system' ? (mq.matches ? 'dark' : 'light') : state.theme;
      document.documentElement.setAttribute('data-rendered-theme', eff);
      syncThemeColorSp();
    }

    if (mq.addEventListener) {
      mq.addEventListener('change', function () { if (state.theme === 'system') applyTheme(); });
    } else if (mq.addListener) {
      mq.addListener(function () { if (state.theme === 'system') applyTheme(); });
    }

    /* ---------- 스킨 ---------- */
    var SKINS = ['wave', 'calc', 'notes'];

    function switchSkin(name) {
      if (SKINS.indexOf(name) === -1) name = 'wave';
      state.skin = name;
      store.set('skin', name);
      var screens = document.querySelectorAll('.screen');
      for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
      var target = $('skin-' + name);
      if (target) target.classList.add('active');
      // 위장 스킨에서 설정 톱니를 숨기기 위한 표식
      document.body.setAttribute('data-rendered-skin', name);
      syncThemeColorSp();
      syncChips();
      updateTapZones();
      if (name === 'wave') renderWave();
      if (name === 'calc') $('calcDisplay').textContent = calc.display;
    }

    function syncChips() {
      setActive('skinSelectors', 'skin', state.skin);
      setActive('themeSelectors', 'themeMode', state.theme);
      setActive('secretSelectors', 'secret', state.secret);
      setActive('rehearsalSelectors', 'rehearsal', state.rehearsal);
    }

    function setActive(groupId, dataKey, value) {
      var btns = $(groupId).querySelectorAll('.skin-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', btns[i].dataset[dataKey] === value);
      }
    }

    /* ---------- 파동 ---------- */
    var eqMatrix = $('eqMatrix');

    function buildWave() {
      eqMatrix.innerHTML = '';
      for (var i = 0; i < BITS; i++) {
        var wrapper = document.createElement('div');
        wrapper.className = 'eq-bar-wrapper';
        var track = document.createElement('div');
        track.className = 'eq-bar-track';
        var fill = document.createElement('div');
        fill.className = 'eq-bar-fill';
        fill.style.animationDelay = (i * 0.12) + 's';
        track.appendChild(fill);
        wrapper.appendChild(track);
        eqMatrix.appendChild(wrapper);
      }
    }

    function renderWave() {
      var bits = bitsOf(state.n);
      var wrappers = eqMatrix.children;
      for (var i = 0; i < wrappers.length; i++) {
        wrappers[i].setAttribute('data-bit', bits ? bits[i] : 'idle');
      }
    }

    var waveForm = $('waveForm');
    var waveInput = $('waveInput');

    function commitWaveInput() {
      setN(parseInt(waveInput.value, 10));
      waveInput.blur();
      waveForm.classList.add('dim');
    }

    // 타이핑하는 즉시 반영한다. 확인을 누르기 전에 이미 값이 들어가 있으므로,
    // iOS에서 첫 탭이 키보드만 내리고 끝나도 결과가 어긋나지 않는다.
    waveInput.addEventListener('input', function () {
      setN(parseInt(waveInput.value, 10));
    });

    waveForm.addEventListener('submit', function (e) {
      e.preventDefault();
      commitWaveInput();
    });

    // 키보드가 떠 있을 때 click/submit이 삼켜지는 경우가 있어 pointerdown에서 처리한다.
    waveForm.querySelector('.wave-submit-btn').addEventListener('pointerdown', function (e) {
      e.preventDefault();
      commitWaveInput();
    });

    waveForm.addEventListener('pointerdown', function (e) {
      if (e.target.classList.contains('wave-submit-btn')) return;
      waveForm.classList.remove('dim');
    });

    /* ---------- 계산기 ---------- */
    var calc = { display: '0', tokens: [], current: '0', armed: false, justEvaluated: false };

    function calcRender() { $('calcDisplay').textContent = calc.display; }

    function calcReset() {
      calc.tokens = [];
      calc.current = '0';
      calc.display = '0';
      calc.armed = false;
      calc.justEvaluated = false;
      calcRender();
    }

    function calcExpression() {
      return calc.tokens.join('') + calc.current;
    }

    function calcNum(d) {
      if (calc.justEvaluated) { calcReset(); }
      calc.current = (calc.current === '0') ? d : calc.current + d;
      calc.display = calcExpression();
      calcRender();
    }

    function calcDot() {
      if (calc.justEvaluated) { calcReset(); }
      if (calc.current.indexOf('.') === -1) calc.current += '.';
      calc.display = calcExpression();
      calcRender();
    }

    var OP_RE = /^[+\u2212\u00d7\u00f7]$/;

    function calcOp(op) {
      var last = calc.tokens[calc.tokens.length - 1];
      if (calc.justEvaluated) {
        calc.tokens = [calc.current];
        calc.justEvaluated = false;
        calc.tokens.push(op);
      } else if (calc.current === '0' && OP_RE.test(last)) {
        // 연산자를 연달아 누르면 마지막 연산자만 교체
        calc.tokens[calc.tokens.length - 1] = op;
      } else {
        calc.tokens.push(calc.current, op);
      }
      calc.current = '0';
      calc.display = calc.tokens.join('');
      calcRender();
    }

    function calcPercent() {
      var v = parseFloat(calc.current);
      if (isNaN(v)) return;
      calc.current = String(v / 100);
      calc.display = calcExpression();
      calcRender();
    }

    function calcSign() {
      if (calc.current === '0') return;
      calc.current = calc.current.charAt(0) === '-' ? calc.current.slice(1) : '-' + calc.current;
      calc.display = calcExpression();
      calcRender();
    }

    function calcBack() {
      if (calc.justEvaluated) { calcReset(); return; }
      if (calc.current.length > 1) {
        calc.current = calc.current.slice(0, -1);
      } else if (calc.current !== '0') {
        calc.current = '0';
      } else if (calc.tokens.length) {
        calc.tokens.pop();
        var last = calc.tokens.pop();
        calc.current = last === undefined ? '0' : last;
      }
      calc.display = calcExpression();
      calcRender();
    }

    // eval 없이 계산: 숫자와 연산자 토큰만 다루므로 임의 코드 실행 위험이 없다.
    function evaluate(tokens) {
      var t = tokens.slice();
      var nums = [parseFloat(t[0])];
      var ops = [];
      for (var i = 1; i < t.length; i += 2) {
        var op = t[i];
        var num = parseFloat(t[i + 1]);
        if (isNaN(num)) break;
        if (op === '×') { nums[nums.length - 1] *= num; }
        else if (op === '÷') { nums[nums.length - 1] /= num; }
        else { ops.push(op); nums.push(num); }
      }
      var result = nums[0];
      for (var j = 0; j < ops.length; j++) {
        result = ops[j] === '+' ? result + nums[j + 1] : result - nums[j + 1];
      }
      if (!isFinite(result) || isNaN(result)) return '오류';
      return String(Math.round(result * 1e10) / 1e10);
    }

    function calcEquals() {
      var value = parseInt(calc.current, 10);
      // 은밀 동작: 1~52를 마지막에 입력하고 = 를 누르면 이진수로 대체된다.
      if (String(value) === calc.current.trim() && value >= 1 && value <= MAX_N) {
        setN(value);
        calc.display = bitsOf(value);
        calc.current = String(value);
        calc.tokens = [];
        calc.justEvaluated = true;
        calcRender();
        return;
      }
      var expr = calc.tokens.concat([calc.current]);
      var out = evaluate(expr);
      calc.tokens = [];
      calc.current = out === '오류' ? '0' : out;
      calc.display = out;
      calc.justEvaluated = true;
      calcRender();
    }

    $('calcGrid').addEventListener('click', function (e) {
      var btn = e.target.closest('.calc-key');
      if (!btn) return;
      var action = btn.dataset.calc;
      if (action === 'num') calcNum(btn.dataset.val);
      else if (action === 'op') calcOp(btn.dataset.val);
      else if (action === 'dot') calcDot();
      else if (action === 'sign') calcSign();
      else if (action === 'percent') calcPercent();
      else if (action === 'clear') calcReset();
      else if (action === 'back') calcBack();
      else if (action === 'equals') calcEquals();
    });

    /* ---------- 메모장 ---------- */
    $('notesInput').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      var ta = e.target;
      var before = ta.value.substring(0, ta.selectionStart);
      var after = ta.value.substring(ta.selectionEnd);
      var lines = before.split('\n');
      var line = lines[lines.length - 1].trim();
      var num = parseInt(line, 10);
      if (String(num) !== line || num < 1 || num > MAX_N) return;
      e.preventDefault();
      setN(num);
      var bits = bitsOf(num);
      ta.value = before + '\n' + bits + after;
      var pos = before.length + 1 + bits.length;
      ta.selectionStart = ta.selectionEnd = pos;
    });

    /* ---------- 비밀 탭 입력 ---------- */
    function updateTapZones() {
      var on = state.secret === 'on' && state.skin === 'wave';
      $('tapTens').classList.toggle('on', on);
      $('tapOnes').classList.toggle('on', on);
    }

    function applyTapValue() {
      var v = state.tens * 10 + state.ones;
      setN(v >= 1 && v <= MAX_N ? v : null);
    }

    function bindTapZone(el, kind) {
      var timer = null, longPressed = false;
      el.addEventListener('pointerdown', function () {
        longPressed = false;
        timer = setTimeout(function () {
          longPressed = true;
          state.tens = 0;
          state.ones = 0;
          setN(null);
        }, 650);
      });
      var cancel = function () { clearTimeout(timer); };
      el.addEventListener('pointerup', function () {
        cancel();
        if (longPressed) return;
        if (kind === 'tens') state.tens = (state.tens + 1) % 6;
        else state.ones = (state.ones + 1) % 10;
        applyTapValue();
      });
      el.addEventListener('pointerleave', cancel);
      el.addEventListener('pointercancel', cancel);
    }

    bindTapZone($('tapTens'), 'tens');
    bindTapZone($('tapOnes'), 'ones');

    /* ---------- 리허설 정보 ---------- */
    function renderRehearsal() {
      var panel = $('rehearsalPanel');
      panel.classList.toggle('active', state.rehearsal === 'on');
      if (state.rehearsal !== 'on') return;
      if (state.n === null) {
        panel.innerHTML = '<span class="r-label">위치가 아직 설정되지 않았습니다.</span>';
        return;
      }
      var bits = bitsOf(state.n);
      var seq = bits.split('').map(function (b) { return b === '1' ? 'IN' : 'OUT'; }).join(' · ');
      var ok = verify(state.n);
      panel.innerHTML =
        '<div><span class="r-label">위치</span> ' + state.n + ' &nbsp;<span class="r-label">이진수</span> ' + bits + '</div>' +
        '<div class="r-seq"><span class="r-label">순서</span> ' + seq + '</div>' +
        '<div>' + (ok
          ? '<span class="r-ok">검증됨</span> — 맨 위 카드가 ' + state.n + '번째에 도착합니다.'
          : '<span class="r-bad">불일치</span> — 시퀀스를 확인하세요.') + '</div>';
    }

    /* ---------- 설정 UI ---------- */
    $('settingsToggleBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      $('settingsModal').classList.toggle('active');
      renderRehearsal();
    });

    document.addEventListener('click', function (e) {
      var modal = $('settingsModal');
      var btn = $('settingsToggleBtn');
      if (modal.classList.contains('active') && !modal.contains(e.target) && !btn.contains(e.target)) {
        modal.classList.remove('active');
      }
    });

    $('skinSelectors').addEventListener('click', function (e) {
      var b = e.target.closest('.skin-btn');
      if (b) switchSkin(b.dataset.skin);
    });

    $('themeSelectors').addEventListener('click', function (e) {
      var b = e.target.closest('.skin-btn');
      if (!b) return;
      state.theme = b.dataset.themeMode;
      store.set('theme', state.theme);
      applyTheme();
      syncChips();
    });

    $('secretSelectors').addEventListener('click', function (e) {
      var b = e.target.closest('.skin-btn');
      if (!b) return;
      state.secret = b.dataset.secret;
      store.set('secret', state.secret);
      syncChips();
      updateTapZones();
    });

    $('rehearsalSelectors').addEventListener('click', function (e) {
      var b = e.target.closest('.skin-btn');
      if (!b) return;
      state.rehearsal = b.dataset.rehearsal;
      store.set('rehearsal', state.rehearsal);
      syncChips();
      renderRehearsal();
    });

    // iOS는 상태바 영역을 theme-color 로 칠한다. 화면 색과 다르면 위쪽에 띠가 생긴다.
    function syncThemeColorSp() {
      var meta = document.querySelector('meta[name="theme-color"]');
      if (!meta) return;
      var light = document.documentElement.getAttribute('data-rendered-theme') === 'light';
      var skin = document.body.getAttribute('data-rendered-skin') || 'wave';
      var c;
      if (skin === 'calc') c = '#000000';            // 계산기는 항상 다크
      else if (skin === 'notes') c = light ? '#FFFFFF' : '#000000';
      else c = light ? '#F2F2F7' : '#000000';
      meta.setAttribute('content', c);
    }

    // 메모 화면 높이를 '키보드에 가리지 않는 영역'으로 맞춘다.
    // 이렇게 해두면 커서가 늘 보이므로 iOS가 화면을 스크롤하지 않고,
    // 상단 헤더가 따라 올라가는 현상이 사라진다.
    (function fitNotesToViewport() {
      var vv = window.visualViewport;
      function fit() {
        var h = vv ? Math.round(vv.height) : window.innerHeight;
        document.documentElement.style.setProperty('--vv-h', h + 'px');
        document.documentElement.style.setProperty('--vv-shift', (vv ? Math.round(vv.offsetTop) : 0) + 'px');
        // iOS가 이미 밀어 올렸다면 되돌린다
        if (window.scrollY !== 0) window.scrollTo(0, 0);
      }
      fit();
      if (vv) {
        vv.addEventListener('resize', fit);
        vv.addEventListener('scroll', fit);
      }
      window.addEventListener('resize', fit);
      window.addEventListener('scroll', function () {
        if (window.scrollY !== 0) window.scrollTo(0, 0);
      }, { passive: true });

      // 손가락 스와이프로 인한 스크롤은 아예 발생시키지 않는다.
      // 설정 시트와 입력창 안에서는 정상 동작해야 하므로 예외로 둔다.
      document.addEventListener('touchmove', function (e) {
        if (document.body.getAttribute('data-rendered-skin') !== 'notes') return;
        var t = e.target;
        if (t && t.closest && t.closest('.settings-modal, textarea, input')) return;
        e.preventDefault();
      }, { passive: false });
    })();

    /* ---------- 통합 런처 ---------- */
    $('gotoAcaanBtn').addEventListener('click', function () { location.href = './acaan.html'; });
    $('gotoHomeBtn').addEventListener('click', function () { location.href = './index.html?home=1'; });

    // 홈 화면 실행일 때만 안전영역 여백을 켠다
    var dm = (typeof window.matchMedia === 'function') ? window.matchMedia('(display-mode: standalone)') : null;
    function syncViewport(){
      var standalone = (dm && dm.matches) || window.navigator.standalone === true;
      document.documentElement.classList.toggle('is-standalone', !!standalone);
    }
    syncViewport();
    window.addEventListener('resize', syncViewport);
    window.addEventListener('orientationchange', function(){ setTimeout(syncViewport, 250); });

    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }

    /* ---------- 시작 ---------- */
    buildWave();
    applyTheme();
    calcRender();
    switchSkin(state.skin);
    setN(null);
  })();
  </script>
</body>
</html>
