<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0B0B0D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Spectrum</title>
<style>
  :root{
    --bg:#0B0B0D; --bg2:#131418;
    --cream:#F3E9D3; --muted-rgb:255,255,255;
    --gold:#C49E54; --gold-bright:#F5E7C0;
    --panel:rgba(255,255,255,0.045); --line:rgba(255,255,255,0.10);
    --sa-top:0px; --sa-bottom:0px;
  }
  @media (display-mode: standalone), (display-mode: fullscreen){
    :root{ --sa-top: env(safe-area-inset-top); --sa-bottom: env(safe-area-inset-bottom); }
  }
  html.is-standalone{ --sa-top: env(safe-area-inset-top); --sa-bottom: env(safe-area-inset-bottom); }

  html[data-theme="light"]{
    --bg:#F4F4F7; --bg2:#EAEAEF;
    --cream:#111114; --muted-rgb:0,0,0;
    --gold:#6B7280; --gold-bright:#111114;
    --panel:rgba(0,0,0,0.04); --line:rgba(0,0,0,0.10);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    /* vh/dvh 대신 실제 화면에 고정 (iOS 홈 화면 실행에서 하단이 뜨는 것 방지) */
    position:fixed; inset:0; overflow-y:auto;
    padding: calc(var(--sa-top) + 28px) 20px calc(var(--sa-bottom) + 24px);
    background:
      radial-gradient(120% 80% at 50% 0%, var(--bg2) 0%, var(--bg) 62%),
      var(--bg);
    color:var(--cream);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display:flex; flex-direction:column;
  }

  header{ text-align:center; margin-bottom:26px; }
  .mark{ display:block; margin:0 auto 14px; }
  .mark rect{ fill:currentColor; }
  header .title{ font-size:19px; font-weight:700; letter-spacing:-0.02em; }
  header .sub{
    margin-top:5px; font-size:12.5px; letter-spacing:0.01em;
    color:rgba(var(--muted-rgb),0.42);
  }

  .cards{ display:flex; flex-direction:column; gap:13px; }
  .card{
    display:block; width:100%; text-align:left; cursor:pointer;
    padding:19px 18px; border-radius:19px;
    border:1px solid var(--line); background:var(--panel);
    color:inherit; font:inherit;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .card:active{ transform:scale(0.985); background:rgba(var(--muted-rgb),0.09); }
  .card-top{ display:flex; align-items:center; gap:11px; }
  .card-ico{ width:34px; height:34px; flex:0 0 auto; color:var(--gold); }
  .card-name{ font-size:16.5px; font-weight:650; letter-spacing:-0.02em; }
  .card-tag{
    margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:0.04em;
    color:rgba(var(--muted-rgb),0.38); border:1px solid var(--line);
    padding:3px 8px; border-radius:6px;
  }
  .card-desc{
    margin-top:11px; font-size:13px; line-height:1.5;
    color:rgba(var(--muted-rgb),0.52);
  }
  .card-meta{
    margin-top:9px; font-size:11.5px; letter-spacing:-0.01em;
    color:rgba(var(--muted-rgb),0.34);
  }

  footer{ margin-top:auto; padding-top:26px; }
  .opt{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 15px; border-radius:14px;
    border:1px solid var(--line); background:var(--panel);
  }
  .opt-name{ font-size:13px; font-weight:600; }
  .opt-hint{ margin-top:9px; font-size:11.5px; line-height:1.5; color:rgba(var(--muted-rgb),0.34); }
  .seg{ display:flex; gap:3px; background:rgba(var(--muted-rgb),0.08); border-radius:9px; padding:3px; }
  .seg button{
    border:none; background:none; color:rgba(var(--muted-rgb),0.5);
    font-family:inherit; font-size:11.5px; font-weight:600;
    padding:6px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;
  }
  .seg button.active{ background:var(--gold-bright); color:var(--bg); }

  @media (max-height: 620px){
    header{ margin-bottom:16px; }
    .mark{ width:44px; height:44px; }
    .card{ padding:15px 16px; }
    .card-desc{ margin-top:8px; }
    .card-meta{ display:none; }
  }
</style>
</head>
<body>

<header>
  <svg class="mark" width="52" height="52" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--gold)">
    <rect x="2"    y="13.5" width="2.6" height="8.5"  rx="1.3"></rect>
    <rect x="6.2"  y="8.5"  width="2.6" height="13.5" rx="1.3"></rect>
    <rect x="10.4" y="2"    width="2.6" height="20"   rx="1.3"></rect>
    <rect x="14.6" y="11"   width="2.6" height="11"   rx="1.3"></rect>
    <rect x="18.8" y="6"    width="2.6" height="16"   rx="1.3"></rect>
  </svg>
  <div class="title">Spectrum</div>
  <div class="sub">카드 위치 계산 도구</div>
</header>

<div class="cards">
  <button class="card" data-go="acaan.html">
    <div class="card-top">
      <svg class="card-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3.5" y="2.5" width="12" height="17" rx="2.4"></rect>
        <path d="M17.2 5.4l3 1.1a2 2 0 0 1 1.2 2.6l-4.1 11.2a2 2 0 0 1-2.6 1.2l-3.1-1.1"></path>
        <path d="M9.5 7.4s-2.6 2.9-2.6 4.7a1.6 1.6 0 0 0 2.4 1.4c-.07 1-.34 1.7-.87 2.2h2.2c-.53-.5-.8-1.2-.87-2.2a1.6 1.6 0 0 0 2.4-1.4c0-1.8-2.6-4.7-2.6-4.7z"></path>
      </svg>
      <span class="card-name">ACAAN 계산기</span>
      <span class="card-tag">CUT</span>
    </div>
    <div class="card-desc">관객이 부른 숫자에 목표 카드가 오도록 몇 장을 컷할지 계산합니다.</div>
    <div class="card-meta">셋업덱 11종 · 더블 버글라스 · 위장 스킨 4종 · 암기 훈련</div>
  </button>

  <button class="card" data-go="spectrum.html">
    <div class="card-top">
      <svg class="card-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="4" width="8" height="16" rx="2"></rect>
        <rect x="13.5" y="4" width="8" height="16" rx="2"></rect>
        <path d="M10.5 8.5h3M10.5 12h3M10.5 15.5h3"></path>
      </svg>
      <span class="card-name">Faro Spectrum</span>
      <span class="card-tag">FARO</span>
    </div>
    <div class="card-desc">맨 위 카드를 원하는 위치로 보내는 인·아웃 파로 6단계 순서를 알려줍니다.</div>
    <div class="card-meta">파동 · 계산기 · 메모장 스킨 · 비밀 탭 입력 · 리허설 검증</div>
  </button>
</div>

<footer>
  <div class="opt">
    <span class="opt-name">앱 실행 시</span>
    <div class="seg" id="startSeg">
      <button data-v="launcher">선택 화면</button>
      <button data-v="acaan">ACAAN</button>
      <button data-v="spectrum">Faro</button>
    </div>
  </div>
  <div class="opt-hint">바로 열기로 두면 이 화면을 건너뜁니다. 각 앱의 설정에서 이 화면으로 돌아올 수 있습니다.</div>
</footer>

<script>
(function(){
  'use strict';
  var store = {
    get: function(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
    set: function(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  };

  // 홈 화면 실행일 때만 안전영역 여백을 켠다 (브라우저 탭은 주소창이 이미 그 자리를 쓴다)
  var dm = (typeof window.matchMedia === 'function') ? window.matchMedia('(display-mode: standalone)') : null;
  if ((dm && dm.matches) || window.navigator.standalone === true) {
    document.documentElement.classList.add('is-standalone');
  }

  // 테마는 ACAAN 쪽 설정을 그대로 따라간다 (앱마다 따로 노는 것보다 낫다)
  var themeMQ = (typeof window.matchMedia === 'function')
    ? window.matchMedia('(prefers-color-scheme: light)') : { matches:false };
  function applyTheme(){
    var pref = store.get('acaan_theme', 'system');
    var t = pref === 'system' ? (themeMQ.matches ? 'light' : 'dark') : pref;
    document.documentElement.dataset.theme = t;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t === 'light' ? '#F4F4F7' : '#0B0B0D');
  }
  applyTheme();
  if (themeMQ.addEventListener) themeMQ.addEventListener('change', applyTheme);

  // 바로 열기 설정. ?home=1 로 들어오면 무시하고 이 화면을 보여준다.
  var KEY = 'suite_start';
  var forced = /[?&]home=1/.test(location.search);
  var start = store.get(KEY, 'launcher');
  if (!forced && start === 'acaan') { location.replace('./acaan.html'); return; }
  if (!forced && start === 'spectrum') { location.replace('./spectrum.html'); return; }

  var seg = document.getElementById('startSeg');
  function syncSeg(){
    var v = store.get(KEY, 'launcher');
    var btns = seg.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].dataset.v === v);
  }
  seg.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    store.set(KEY, b.dataset.v);
    syncSeg();
  });
  syncSeg();

  var cards = document.querySelectorAll('.card');
  for (var i = 0; i < cards.length; i++) {
    cards[i].addEventListener('click', function(){ location.href = './' + this.dataset.go; });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
