function parseCardShorthand(text){
  const t = text.trim().toUpperCase();
  const m = t.match(/^(10|[2-9]|[AJQK])([HSDC])$/);
  if(!m) return null;
  return { rank:m[1], suit:m[2] };
}

// kind: 'card' | 'bottom' | 'number' — 노트 스킨에서 버튼 그리드 대신 쓰는 한 줄 텍스트 입력 dock
function renderNotesInputDock(kind){
  // 숫자 단계에서도 inputmode는 text로 둔다 — 실제 메모앱은 계속 같은 글자 키보드라
  // 여기서 숫자 키패드로 바뀌면 위장이 깨진다.
  // 숫자 단계에서는 '지금 스택 몇 번째인지'를 자리표시로 보여준다
  // (그 숫자가 곧 위에서 세었을 때 컷 없이 맞는 숫자)
  let numPh = '숫자';
  if(state.rank && state.suit){
    const posP = getPosition(state.deckKey, state.rank, state.suit);
    if(posP) numPh = String(shiftPosition(posP, getRotation()));
  }
  const cfg = {
    card:   { placeholder:'예: 7d, kc, 10h' },
    bottom: { placeholder:'예: 7d · 모르면 비워두고 우측 상단 체크' },
    number: { placeholder: numPh }
  }[kind];

  // 결과가 이미 표시된 상태면 stage는 renderNotesNumberStage가 그린 내용을 유지 (덮어쓰지 않음)
  const resultShown = (kind === 'number' && state.spectatorNum && state.rank && state.suit);

  if(!resultShown){
    // 입력창은 노트 "본문"처럼 stage에 둠 - 이전에 입력한 줄들은 그대로 남고 새 줄이 이어짐
    const linesHtml = state.noteLines.map((line, i)=>
      `<div class="notes-line">${line}</div>`
    ).join('');
    // 실제 메모앱처럼: 새 노트(내용 없음)일 때만 상단 중앙에 날짜가 표시된다
    const dateLine = state.noteLines.length === 0
      ? `<div class="notes-date">${notesDateText()}</div>` : '';
    // 숫자를 기다리는 중이면, 유도할 숫자를 '연한 글씨'로만 깔아둔다 (입력 안 된 자리처럼 보임)
    let hintHtml = '';
    if(kind === 'number' && state.rank && state.suit){
      const posH = getPosition(state.deckKey, state.rank, state.suit);
      if(posH){
        const rotH = getRotation();
        const curH = shiftPosition(posH, rotH);
        // 기본 스킨과 같은 '다음 수' 제안을 연한 글씨로
        nextMoves(posH, rotH).slice(0,3).forEach(m=>{
          hintHtml += `<div class="notes-line notes-faint">${m.tag} · ${m.title}</div>`;
        });
      }
    }
    stage.innerHTML = `
      ${dateLine}
      <div class="notes-plain">
        ${linesHtml}
        <input type="text" id="notesInput" class="notes-body-input" placeholder="${cfg.placeholder}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">
        ${hintHtml}
      </div>
    `;
  }

  // dock: 입력 중이면 키보드 위 서식바, 결과 표시 중이면 키보드 내려간 상태의 툴바
  if(resultShown){
    dock.innerHTML = `
      <div class="notes-rest-row">
        <div class="notes-rest-pill">
          <span class="notes-format-item">${NOTE_ICONS.checklist}</span>
          <span class="notes-format-item">${NOTE_ICONS.clip}</span>
          <span class="notes-format-item">${NOTE_ICONS.markup}</span>
          <span class="notes-format-item">${NOTE_ICONS.ai}</span>
        </div>
        <div class="notes-compose" id="notesComposeBtn">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12.8V18a2.6 2.6 0 0 1-2.6 2.6H6a2.6 2.6 0 0 1-2.6-2.6V7.1A2.6 2.6 0 0 1 6 4.5h5.2"/><path d="M16.4 3.6l3.9 3.9-6.6 6.6-4.4.5.5-4.4z"/></svg>
        </div>
      </div>
    `;
    // 새 메모 버튼 = 새 카드로 처음부터
    document.getElementById('notesComposeBtn').onclick = resetTrick;
  } else {
    dock.innerHTML = '';
  }

  // 되돌릴 게 있을 때만 undo 아이콘 노출 (편집 중 + 내용 존재)
  function syncUndo(){
    const inp = document.getElementById('notesInput');
    const has = state.noteLines.length > 0 || (!!inp && inp.value.trim() !== '');
    document.body.classList.toggle('can-undo', has);
  }
  syncUndo();

  const input = document.getElementById('notesInput');
  if(!input){
    // 결과가 표시된 상태 - 입력창 없음. 상단 체크는 새 카드 시작으로 동작
    notesSubmitFn = resetTrick;
    return;
  }
  if(document.activeElement !== input){
    input.focus();
    // 커서를 맨 끝으로
    input.setSelectionRange(input.value.length, input.value.length);
  }
  stage.scrollTop = stage.scrollHeight;

  function submit(){
    const val = input.value.trim();
    if(kind === 'card'){
      const parsed = parseCardShorthand(val);
      if(!parsed){ input.classList.add('shake'); setTimeout(()=>input.classList.remove('shake'),300); return; }
      state.rank = parsed.rank; state.suit = parsed.suit;
      state.noteLines.push(val);
      tryCompleteCard();
    } else if(kind === 'bottom'){
      if(!val){ skipBottom(); return; }
      const parsed = parseCardShorthand(val);
      if(!parsed){ input.classList.add('shake'); setTimeout(()=>input.classList.remove('shake'),300); return; }
      state.bottomRank = parsed.rank; state.bottomSuit = parsed.suit;
      state.noteLines.push(val);
      tryCompleteBottom();
    } else if(kind === 'number'){
      // 메모에 자유롭게 적는 방식이라, 입력이 카드꼴이면 숫자가 아니라 카드로 알아서 받는다.
      //  · 바텀카드가 아직 없으면 → 바텀카드로 인식하고 계속 숫자를 기다림
      //  · 이미 있으면 → 더블 버글라스의 두 번째 카드로 인식
      const asCard = parseCardShorthand(val);
      if(asCard){
        if(!(state.bottomRank && state.bottomSuit)){
          state.bottomRank = asCard.rank; state.bottomSuit = asCard.suit;
        } else {
          state.rank2 = asCard.rank; state.suit2 = asCard.suit;
        }
        state.noteLines.push(val);
        renderAll();
        return;
      }
      const n = parseInt(val, 10);
      if(!(n>=1 && n<=52)){ input.classList.add('shake'); setTimeout(()=>input.classList.remove('shake'),300); return; }
      state.numBuffer = String(n);
      state.spectatorNum = n;
      state.noteLines.push(val);
      afterNumberConfirmed();
    }
  }

  notesSubmitFn = submit;
  input.addEventListener('input', ()=>{
    syncUndo();
    if(kind === 'number'){
      // 순수 숫자일 때만 즉시 반영 ('9c' 같은 카드 입력이 9로 해석되면 안 됨)
      const v = input.value.trim();
      if(/^\d{1,2}$/.test(v)){
        const n = parseInt(v, 10);
        if(n >= 1 && n <= 52){ state.numBuffer = String(n); state.spectatorNum = n; state.altIndex = 0; }
      }
    }
  });
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
}

// ================= 렌더 =================
const stage = document.getElementById('stage');
const dock = document.getElementById('dock');

function renderAll(){
  // 노트 결과 화면에서 달아둔 탭 핸들러가 다른 화면에 남지 않도록 매번 비운다
  stage.onclick = null;
  const dcName = document.getElementById('dcName');
  if(dcName) dcName.textContent = DECKS[state.deckKey].label;
  renderSkinGrid();
  renderOptions();
  stage.classList.remove('is-result');
  const notesResultShown = isNotesSkin() && state.spectatorNum && state.rank && state.suit;
  const newCardBtnEl = document.getElementById('newCardBtn');
  // 노란 체크는 실제 메모앱처럼 '편집 중'일 때만 보인다 (결과 화면에서는 숨김)
  newCardBtnEl.style.display =
    isNotesSkin() ? (notesResultShown ? 'none' : 'flex')
                  : ((state.rank && state.suit) ? 'inline' : 'none');

  if(state.mode === 'card2'){
    renderNumberStage();
    renderCard2Dock();
  } else if(state.mode === 'number'){
    renderNumberStage();
    renderNumberDock();
  } else if(state.mode === 'bottom' && state.rank && state.suit){
    renderBottomStage();
    renderBottomDock();
  } else {
    renderCardStage();
    renderCardDock();
  }
}

function renderCardStage(){
  if(isNotesSkin()){
    stage.innerHTML = `<div class="notes-plain"></div>`;
    return;
  }
  stage.innerHTML = `
    <div class="placeholder">
      <div class="big-q">🂠</div>
      <div>아래에서 카드를 선택하세요</div>
      <div class="deck-name">${DECKS[state.deckKey].label} 사용 중</div>
    </div>
  `;
}

function renderCardDock(){
  if(isNotesSkin()){ renderNotesInputDock('card'); return; }
  if(isCalcSkin()){ renderCalcKeypadDock('card'); return; }
  dock.innerHTML = `
    <div class="dock-label">
      <span>카드 입력</span>
      ${lastSnapshot ? '<button id="undoResetBtn" class="undo-reset">되돌리기</button>' : ''}
    </div>
    <div class="rank-grid" id="rankGrid"></div>
    <div class="suit-grid" id="suitGrid"></div>
  `;
  const undoBtn = document.getElementById('undoResetBtn');
  if(undoBtn) undoBtn.onclick = restoreSnapshot;
  const rankGrid = document.getElementById('rankGrid');
  RANKS.forEach(r=>{
    const btn = document.createElement('button');
    btn.className = 'rank-btn' + (state.rank===r ? ' active':'');
    btn.textContent = r;
    btn.onclick = ()=>{ state.rank = r; tryCompleteCard(); };
    rankGrid.appendChild(btn);
  });
  const suitGrid = document.getElementById('suitGrid');
  SUITS.forEach(s=>{
    const btn = document.createElement('button');
    btn.className = 'suit-btn ' + s.color + (state.suit===s.code ? ' active':'');
    // 랭크 미선택 상태에서는 앞에 작은 A를 띄워 '바로 누르면 에이스'임을 알린다
    btn.innerHTML = (state.rank ? '' : '<span class="suit-a">A</span>') + s.symbol;
    btn.onclick = ()=>{
      if(!state.rank) state.rank = 'A';
      state.suit = s.code;
      tryCompleteCard();
    };
    suitGrid.appendChild(btn);
  });
}

function renderBottomStage(){
  const suitInfo = SUITS.find(s=>s.code===state.suit);
  if(isNotesSkin()){
    stage.innerHTML = `<div class="notes-plain">${state.rank}${suitInfo.symbol} 확인</div>`;
    return;
  }
  stage.innerHTML = `
    <div class="panel" style="padding:10px 14px;">
      <div class="result-top" style="margin-bottom:0;">
        <div class="picked-card ${suitInfo.color}" style="font-size:22px;">${state.rank}${suitInfo.symbol}</div>
        <div class="deck-tag" style="text-align:left;">${DECKS[state.deckKey].label} · 타겟 카드</div>
      </div>
    </div>
    <div class="placeholder" style="height:auto; padding:24px 0;">
      <div class="big-q">🂠</div>
      <div>덱을 한 번 컷한 상태라면,<br>지금 보이는 바텀 카드를 입력하세요</div>
      <div class="deck-name">모르면 스킵 — 새 스택 그대로로 가정합니다</div>
    </div>
  `;
}

function renderBottomDock(){
  if(isNotesSkin()){ renderNotesInputDock('bottom'); return; }
  if(isCalcSkin()){ renderCalcKeypadDock('bottom'); return; }
  dock.innerHTML = `
    <div class="dock-label"><span>현재 바텀 카드 (선택)</span><button id="skipBottomBtn">스킵</button></div>
    <div class="rank-grid" id="bottomRankGrid"></div>
    <div class="suit-grid" id="bottomSuitGrid"></div>
  `;
  document.getElementById('skipBottomBtn').onclick = skipBottom;

  const rankGrid = document.getElementById('bottomRankGrid');
  RANKS.forEach(r=>{
    const btn = document.createElement('button');
    btn.className = 'rank-btn' + (state.bottomRank===r ? ' active':'');
    btn.textContent = r;
    btn.onclick = ()=>{ state.bottomRank = r; tryCompleteBottom(); };
    rankGrid.appendChild(btn);
  });
  const suitGrid = document.getElementById('bottomSuitGrid');
  SUITS.forEach(s=>{
    const btn = document.createElement('button');
    btn.className = 'suit-btn ' + s.color + (state.bottomSuit===s.code ? ' active':'');
    btn.innerHTML = (state.bottomRank ? '' : '<span class="suit-a">A</span>') + s.symbol;
    btn.onclick = ()=>{
      if(!state.bottomRank) state.bottomRank = 'A';
      state.bottomSuit = s.code;
      tryCompleteBottom();
    };
    suitGrid.appendChild(btn);
  });
}

// 노트 스킨: 계산 결과를 UI 카드가 아니라 그냥 타이핑한 메모처럼 문장으로 보여줌
function renderNotesNumberStage(pos, suitInfo, rot, curPos){
  // 실제 메모처럼 보이게: 입력한 줄만 흰 글씨로 남기고,
  // 계산 결과는 '아직 입력 안 된 자리'처럼 연한 회색 한 줄로만 얹는다.
  const linesOf = arr => arr.map(l => `<div class="notes-line">${l}</div>`).join('');

  if(!state.spectatorNum){
    stage.innerHTML = `<div class="notes-plain">${linesOf(state.noteLines)}</div>`;
    stage.onclick = null;
    return;
  }

  // 관객에게 화면을 보여줄 때는 카드와 숫자 두 줄만 남긴다.
  // (바텀카드를 입력했더라도 그 줄은 숨긴다)
  const shown = state.notesHidden && state.noteLines.length > 1
    ? [state.noteLines[0], state.noteLines[state.noteLines.length - 1]]
    : state.noteLines;

  let faint = '';
  if(!state.notesHidden){
    const outsN = computeOuts(pos, state.spectatorNum, rot);
    const o = outsN[Math.min(state.altIndex, outsN.length - 1)];
    const arrow = o.cut === 0 ? '' : (o.dir === '위→아래' ? '↓' : '↑');
    const cut = o.cut === 0
      ? (o.bridge ? `${o.bridgeName} 컷만` : '이동 없이')
      : `${o.bridge ? o.bridgeName + ' + ' : ''}${o.cut}장 ${arrow}`;
    const how = (o.label.includes('위에서') ? '위' : '아래')
      + (o.tech !== '정확히 그 카드' ? ' · ' + o.tech : '');
    faint = `<div class="notes-line notes-faint">${cut} · ${how}${o.practical ? '' : ' ⚠'}</div>`;
  }

  stage.innerHTML = `<div class="notes-plain">${linesOf(shown)}${faint}</div>`;

  // 빈 곳을 탭하면 흐릿한 줄(과 바텀카드 줄)을 숨겼다 다시 보였다 한다
  stage.onclick = ()=>{
    state.notesHidden = !state.notesHidden;
    renderAll();
  };
}



// ================= 더블 버글라스 =================
// 두 카드를 '같은 덱 상태 + 같은 숫자'로 동시에 만족시키는 해를 직접 찾는다.
// (첫 카드용 컷을 하면 두 번째 카드 위치도 함께 움직이므로 따로 계산하면 어긋난다)
function duoSolve(posA, posB, rot, N){
  const out = [];
  for(let R = 0; R < 52; R++){
    const a = shiftPosition(posA, R), b = shiftPosition(posB, R);
    const dCur = mod52(R - rot), dBr = mod52(R - 26);
    const cutCur = Math.min(dCur, 52 - dCur), cutBr = Math.min(dBr, 52 - dBr);
    const bridge = cutBr < cutCur;
    const cut = bridge ? cutBr : cutCur;
    const d = bridge ? dBr : dCur;
    const dir = d === 0 ? null : (d <= 52 - d ? '위→아래' : '아래→위');
    const push = (c)=>{ if(!N || c.N === N) out.push({ R, cut, dir, bridge, ...c }); };
    for(let oa=0; oa<=2; oa++) for(let ob=0; ob<=1; ob++){
      const n1 = a - oa, n2 = 53 - b - ob;
      if(n1 === n2 && n1 >= 1 && n1 <= 52) push({ N:n1, aF:'top', oa, bF:'bot', ob });
    }
    for(let oa=0; oa<=1; oa++) for(let ob=0; ob<=2; ob++){
      const n1 = 53 - a - oa, n2 = b - ob;
      if(n1 === n2 && n1 >= 1 && n1 <= 52) push({ N:n1, aF:'bot', oa, bF:'top', ob });
    }
    for(let oa=0; oa<=2; oa++) for(let ob=0; ob<=2; ob++){
      if(oa === ob) continue;
      const n1 = a - oa, n2 = b - ob;
      if(n1 === n2 && n1 >= 1 && n1 <= 52) push({ N:n1, aF:'top', oa, bF:'top', ob });
    }
  }
  out.sort((x,y)=> x.cut - y.cut || (x.oa + x.ob) - (y.oa + y.ob));
  return out;
}
const OFF_TXT = { 0:'', 1:' · 다음 카드', 2:' · 더블리프트' };
function duoCutText(s){
  if(s.cut === 0) return s.bridge ? '센터 컷만' : '컷 없이';
  const arrow = s.dir === '위→아래' ? '↓' : '↑';
  return `${s.bridge ? '센터 + ' : ''}${s.cut}장 ${arrow}`;
}



function renderNumberStage(){
  // 숫자 먼저 모드: 아직 카드를 안 골랐으면 숫자만 받는 간단한 화면
  if(!(state.rank && state.suit)){
    if(isNotesSkin()){ stage.innerHTML = `<div class="notes-plain"></div>`; return; }
    stage.innerHTML = `
      <div class="placeholder">
        <div class="big-q">🂠</div>
        <div>관객이 부른 숫자를 입력하세요</div>
        <div class="deck-name">${DECKS[state.deckKey].label} 사용 중</div>
      </div>`;
    return;
  }
  const pos = getPosition(state.deckKey, state.rank, state.suit);
  const suitInfo = SUITS.find(s=>s.code===state.suit);
  const rot = getRotation();
  const curPos = shiftPosition(pos, rot);
  const cls = classifyPos(curPos);

  if(isNotesSkin()){
    renderNotesNumberStage(pos, suitInfo, rot, curPos);
    return;
  }
  const bottomInfo = state.bottomRank
    ? `바텀카드 ${state.bottomRank}${SUITS.find(s=>s.code===state.bottomSuit).symbol} 기준 (${rot}장 컷된 상태)`
    : '바텀카드 미입력 (새 스택 그대로 가정)';

  // 관객 숫자가 아직 확정되지 않은 경우: 카드 정보를 자세히 보여줌
  if(!state.spectatorNum){
    stage.innerHTML = `
      <div class="panel" style="padding:12px 14px;">
        <div class="result-top" style="margin-bottom:2px;">
          <div class="picked-card ${suitInfo.color}">${state.rank}${suitInfo.symbol}</div>
          <div class="number-row" style="margin:0;">
            <div class="big" style="font-size:28px;">${curPos}</div>
            <div class="tag ${cls.key}">${cls.label}</div>
          </div>
        </div>
        <div class="hint" style="font-size:11.5px;">${bottomInfo} · <span style="text-decoration:underline; cursor:pointer;" onclick="goToBottomStep()">변경</span></div>
        <div class="spectator-line">
          <span class="label">관객이 부른 숫자</span>
          <span class="value ${state.numBuffer? '' : 'empty'}">${state.numBuffer || '입력 대기'}</span>
        </div>
      </div>
      ${duoGuideHtml(pos, rot)}
      ${(state.rank2 && state.suit2) ? '' : movesHtml(pos, rot)}
    `;
    return;
  }

  // 관객 숫자가 확정된 경우: 추천 아웃 하나를 크게, 나머지는 접어둠 (연출 중 빠르게 읽기 위해)
  const outs = computeOuts(pos, state.spectatorNum, rot);

  function cutLine(o){
    if(o.cut === 0) return o.bridge ? (o.bridgeName + ' 컷만') : '컷 없이';
    const arrow = o.dir === '위→아래' ? '↓' : '↑';
    return (o.bridge ? o.bridgeName + ' + ' : '') + `${o.cut}장 ${arrow}`;
  }
  // 실행 단축: 위에서 세는 숫자가 크면, 덱을 뒤집어 아래에서 (53-N)장만 세도 같은 카드.
  // 커버리지가 늘어나는 건 아니고 '세는 수고'를 줄여주는 연출용 대안이다.
  function shortcutLine(o){
    if(!o.label.includes('위에서')) return '';
    const neff = state.spectatorNum + o.offset;
    if(neff <= 26) return '';
    return `뒤집어서 아래에서 ${53 - neff}장 (53−${neff})`;
  }

  function methodLine(o){
    const parts = [o.label.includes('위에서') ? '위에서 카운트' : '아래에서 카운트'];
    if(o.tech !== '정확히 그 카드') parts.push(o.tech);
    return parts.join(' · ');
  }

  const heroIdx = Math.min(state.altIndex, outs.length - 1);
  const hero = outs[heroIdx];
  const altsHtml = outs.map((o,i)=> i===heroIdx ? '' : `
    <div class="alt-item${o.practical ? '' : ' heavy'}" data-i="${i}">
      <span class="alt-cut">${cutLine(o)}</span>
      <span class="alt-method">${methodLine(o)}${shortcutLine(o) ? ' · ' + shortcutLine(o) : ''}</span>
    </div>`).join('');

  const heroWarn = hero.practical ? ''
    : `<div class="hero-warn">${hero.cut}장 이동 — 티 날 수 있음</div>`;
  // 더블 버글라스: 한 번의 컷으로 두 장을 동시에 맞추는 해를 먼저 찾고,
  // 없으면 첫 장 공개 후 다시 컷하는 순차 방식으로 넘어간다.
  let duoBlock = '', secondHtml = '';
  if(state.rank2 && state.suit2){
    const si2 = SUITS.find(x=>x.code===state.suit2);
    const pos2 = getPosition(state.deckKey, state.rank2, state.suit2);
    if(pos2){
      const sols = duoSolve(pos, pos2, rot, state.spectatorNum);
      if(sols.length){
        const d = sols[0];
        const aTxt = (d.aF === 'top' ? '위에서' : '아래에서') + ' 카운트' + OFF_TXT[d.oa];
        const bTxt = (d.bF === 'top' ? '위에서' : '아래에서') + ' 카운트' + OFF_TXT[d.ob];
        duoBlock = `
          <div class="hero">
            <div class="hero-cut">${duoCutText(d)}</div>
            <div class="hero-method">한 번 컷으로 두 장 동시</div>
            ${d.cut <= 5 ? '' : `<div class="hero-warn">${d.cut}장 이동 — 티 날 수 있음</div>`}
          </div>
          <div class="second">
            <div class="second-row">
              <span class="second-card ${suitInfo.color}">${state.rank}${suitInfo.symbol}</span>
              <span class="second-method">${aTxt}</span>
            </div>
            <div class="second-row" style="margin-top:6px;">
              <span class="second-card ${si2.color}">${state.rank2}${si2.symbol}</span>
              <span class="second-method">${bTxt}</span>
            </div>
          </div>`;
      } else {
        // 동시 해가 없으면: 첫 장을 먼저 공개하고, 그 상태에서 다시 컷
        const rotAfter = rotationAfter(hero, rot);
        const o2 = computeOuts(pos2, state.spectatorNum, rotAfter)[0];
        const arrow2 = o2.cut===0 ? '' : (o2.dir==='위→아래'?'↓':'↑');
        const cut2 = o2.cut===0 ? (o2.bridge?'센터 컷만':'이동 없음')
                                : `${o2.bridge?'센터 + ':''}${o2.cut}장 ${arrow2}`;
        const m2 = (o2.label.includes('위에서')?'위에서':'아래에서')+' 카운트'
                 + (o2.tech!=='정확히 그 카드' ? ' · '+o2.tech : '');
        secondHtml = `<div class="second">
          <div class="second-tag">② 첫 장 공개 후 이어서 · 같은 숫자 ${state.spectatorNum}</div>
          <div class="second-row">
            <span class="second-card ${si2.color}">${state.rank2}${si2.symbol}</span>
            <span class="second-cut">${cut2}${o2.practical?'':' ⚠'}</span>
          </div>
          <div class="second-method">${m2}</div>
        </div>`;
      }
    }
  }

  const heroShortcut = shortcutLine(hero)
    ? `<div class="hero-shortcut">${shortcutLine(hero)}</div>` : '';

  stage.classList.add('is-result');
  stage.innerHTML = `
    <div class="res-head">
      <span class="res-meta">스택 ${curPos} · 관객 <b>${state.spectatorNum}</b></span>
    </div>

    ${duoBlock || `
    <div class="hero">
      <div class="hero-index ${suitInfo.color}">${state.rank}${suitInfo.symbol}</div>
      <div class="hero-cut">${cutLine(hero)}</div>
      <div class="hero-method">${methodLine(hero)}</div>
      ${heroShortcut}
      ${heroWarn}
    </div>` + secondHtml}

    <details class="alts"${state.altIndex ? ' open' : ''}>
      <summary>다른 방법 ${outs.length - 1}개 · 탭하면 위로 올라갑니다</summary>
      ${altsHtml}
      <div class="alt-note">${bottomInfo}</div>
      <div class="alt-note">연출 후 센 카드 더미를 뒤집어 덱 위에 얹으면 스택이 복구됩니다.</div>
    </details>
  `;

  stage.querySelectorAll('.alt-item').forEach(el=>{
    el.onclick = ()=>{ state.altIndex = parseInt(el.dataset.i, 10); renderAll(); };
  });
}




// ================= 실수 방지: 초기화 되돌리기 =================
// 연출 중 '새 카드'를 잘못 누르면 입력이 통째로 날아간다. 확인 창은 탭이 늘어나니
// 대신 직전 상태를 잠깐 보관해 두고 한 번에 복구할 수 있게 한다.
let lastSnapshot = null, snapshotTimer = null;
const SNAP_KEYS = ['rank','suit','rank2','suit2','bottomRank','bottomSuit',
                   'numBuffer','spectatorNum','noteLines','altIndex','mode','notesHidden'];
function takeSnapshot(){
  if(!state.rank && !state.spectatorNum) return;   // 빈 상태면 보관할 것 없음
  const snap = {};
  SNAP_KEYS.forEach(k=> snap[k] = Array.isArray(state[k]) ? state[k].slice() : state[k]);
  lastSnapshot = snap;
  clearTimeout(snapshotTimer);
  snapshotTimer = setTimeout(()=>{ lastSnapshot = null; renderAll(); }, 15000);
}
function restoreSnapshot(){
  if(!lastSnapshot) return;
  SNAP_KEYS.forEach(k=> state[k] = lastSnapshot[k]);
  lastSnapshot = null;
  clearTimeout(snapshotTimer);
  renderAll();
}

// ================= 다음 수 제안 (재즈 방식) =================
// 미리 정해두지 않고, 지금 아는 정보만으로 "이번엔 어느 길이 제일 좋은지" 순위를 매긴다.
function nextMoves(pos, rot){
  const moves = [];

  // 1) 숫자를 물을 필요조차 없는 자리 — 가장 강력
  const ir = instantReveal(pos, rot);
  if(ir){
    moves.push({ tag:'즉시', title:'숫자 묻지 말고 바로 공개',
                 body: ir, strong:true });
  }

  // 2) 컷 없이 되는 숫자 = 유도 1순위
  const gs = guideNumbers(pos, rot);
  const easy = gs.filter(g => g.n <= 15);
  const mid  = gs.filter(g => g.n > 15 && g.n <= 30);
  const pick = (easy.length ? easy : (mid.length ? mid : gs)).slice(0,2);
  pick.forEach(g=>{
    if(g.noTouch){
      moves.push({ tag:'버글라스', strong:true,
                   title:`${g.n}번으로 유도 — ${g.how}`,
                   body: `컷도 이동도 없이 그대로 셉니다 — 노터치 버글라스. `
                       + patterFor(g.n).line + ` (${patterFor(g.n).note})` });
    } else {
      moves.push({ tag:'유도', title:`${g.n}번으로 유도 — ${g.how}`,
                   body: patterFor(g.n).line + ` (${patterFor(g.n).note})` });
    }
  });

  // 3) 자연스러운 숫자가 안 나오면 관객 컷으로 판을 새로 짠다
  const smallest = gs.length ? gs[0].n : 99;
  if(!ir && smallest > 15){
    moves.push({ tag:'컷', title:'관객에게 컷시키고 바텀 확인',
                 body:'컷하면 위치가 통째로 바뀝니다. 바텀카드를 글림스해 입력하면 새 숫자들이 나옵니다.' });
  }

  // 4) 두 번째 카드를 받으면 더 좋아지는 경우
  if(!(state.rank2 && state.suit2)){
    // 정말 편한 숫자가 하나도 없을 때만 더블을 권한다
    const comfy = gs.some(g => g.n >= 1 && g.n <= 20);
    if(!comfy){
      moves.push({ tag:'더블', title:'두 번째 카드를 받는 편이 유리',
                   body:'혼자서는 편한 숫자가 없습니다. 두 장이면 한 컷으로 동시에 맞출 숫자가 넓어집니다.' });
    }
  }
  return moves;
}

function movesHtml(pos, rot){
  const ms = nextMoves(pos, rot).slice(0,3);
  if(!ms.length) return '';
  const rows = ms.map((m,i)=>`
    <div class="mv-item${i===0?' best':''}${m.strong?' strong':''}">
      <div class="mv-top"><span class="mv-tag">${m.tag}</span><span class="mv-title">${m.title}</span></div>
      <div class="mv-body">${m.body}</div>
    </div>`).join('');
  return `<div class="panel"><h2>다음 수</h2>${rows}</div>`;
}

// 두 카드가 다 정해졌으면, 한 번 컷으로 동시에 되는 '유도할 숫자'를 알려준다.
// 실제 연출 순서(카드 두 장 먼저 → 숫자 유도)와 맞물리는 핵심 화면.
function duoGuideHtml(pos, rot){
  if(!(state.rank2 && state.suit2)) return '';
  const pos2 = getPosition(state.deckKey, state.rank2, state.suit2);
  if(!pos2) return '';
  const si2 = SUITS.find(x=>x.code===state.suit2);
  const sols = duoSolve(pos, pos2, rot, null).filter(x=>x.cut <= 5);
  if(!sols.length) return '';
  const seen = new Set();
  const rows = sols.filter(x=>{ if(seen.has(x.N)) return false; seen.add(x.N); return true; })
    .slice(0,2).map((d,i)=>{
      const aTxt = (d.aF==='top'?'위':'아래') + OFF_TXT[d.oa];
      const bTxt = (d.bF==='top'?'위':'아래') + OFF_TXT[d.ob];
      const noTouch = (d.cut === 0 && !d.bridge);
      return `<div class="guide-item${i===0?' best':''}">
        <div class="guide-top"><span class="guide-n">${d.N}</span><span class="guide-how">${duoCutText(d)}</span>${noTouch?'<span class="guide-badge">버글라스</span>':''}</div>
        <div class="guide-line">${state.rank}${SUITS.find(x=>x.code===state.suit).symbol} ${aTxt} · ${state.rank2}${si2.symbol} ${bTxt}</div>
        <div class="guide-note">${patterFor(d.N).line}</div>
      </div>`;
    }).join('');
  return `<div class="panel"><h2>두 장 동시 — 유도할 숫자</h2>${rows}</div>`;
}

// 두 번째 카드 입력 (같은 관객 숫자를 그대로 재사용)

    <div class="rank-grid" id="rank2Grid"></div>
    <div class="suit-grid" id="suit2Grid"></div>

    b.onclick=()=>{ state.rank2=r; if(state.suit2) state.mode='number'; renderAll(); };

  });

function renderNumberDock(){
  if(isNotesSkin()){ renderNotesInputDock('number'); return; }
  if(isCalcSkin()){ renderCalcKeypadDock('number'); return; }

  // 두 번째 카드는 숫자 받기 '전'에도 지정할 수 있어야 유도할 숫자를 역산해준다
  const canSecond = state.rank && state.suit;
  // 숫자 먼저 모드: 숫자를 다 친 다음 직접 넘어간다 (자동 전환은 두 자리 입력을 막는다)
  const needCard = !(state.rank && state.suit);
  dock.innerHTML = `
    <div class="dock-label">
      <span>관객 숫자 입력</span>
      <span>
        ${canSecond ? `<button id="secondCardBtn" style="margin-right:10px;">${(state.rank2&&state.suit2)?'2번 해제':'두 번째 카드'}</button>` : ''}
        ${needCard ? '' : '<button id="backToBottomBtn" style="margin-right:10px;">바텀카드</button>'}
        ${needCard
          ? `<button id="toCardBtn" class="dock-next"${state.spectatorNum?'':' disabled'}>카드 입력 →</button>`
          : '<button id="backToCardBtn">카드 변경</button>'}
      </span>
    </div>
    <div class="keypad-display ${state.numBuffer ? '' : 'placeholder-txt'}">${state.numBuffer || '숫자를 입력하세요 (1-52)'}</div>
    <div class="keypad-grid" id="keypadGrid"></div>
  `;
  const backCard = document.getElementById('backToCardBtn');
  if(backCard) backCard.onclick = resetTrick;
  const backBottom = document.getElementById('backToBottomBtn');
  if(backBottom) backBottom.onclick = goToBottomStep;
  const toCard = document.getElementById('toCardBtn');
  if(toCard) toCard.onclick = ()=>{ if(state.spectatorNum){ state.mode='card'; renderAll(); } };
  const sc2 = document.getElementById('secondCardBtn');
  if(sc2) sc2.onclick = ()=>{
    if(state.rank2 && state.suit2){ state.rank2=null; state.suit2=null; renderAll(); }
    else { state.mode='card2'; renderAll(); }
  };

  // 확인 버튼 없이, 숫자를 누르는 즉시 결과가 갱신된다 (연출 중 흘끗 한 번으로 끝내기 위해)
  const keys = ['1','2','3','4','5','6','7','8','9','지우기','0','⌫'];
  const grid = document.getElementById('keypadGrid');
  keys.forEach(k=>{
    const btn = document.createElement('button');
    btn.className = 'key-btn' + (k==='지우기' ? ' wide':'');
    btn.textContent = k;
    btn.onclick = ()=>{
      if(k === '지우기'){
        state.numBuffer = '';            // 숫자만 전부 지움 (카드는 유지)
      } else if(k === '⌫'){
        state.numBuffer = state.numBuffer.slice(0,-1);   // 한 자리씩
      } else {
        if(state.numBuffer.length < 2){ state.numBuffer += k; }
      }
      liveNumber();
    };
    grid.appendChild(btn);
  });
}

// 입력 중인 숫자가 1~52면 즉시 결과로 반영 (별도 확인 탭 불필요)
function liveNumber(){
  const n = parseInt(state.numBuffer, 10);
  if(n >= 1 && n <= 52){ state.spectatorNum = n; state.altIndex = 0; }
  else { state.spectatorNum = null; }
  renderAll();
}

const BUILD = 'v18';

// 메모 스킨에서 화면이 밀리는 것을 아예 막는다.
// (1) 손가락 스와이프로 인한 스크롤은 touchmove 단계에서 차단하고,
// (2) iOS가 커서를 보이려고 프로그램적으로 밀어 올린 경우는 즉시 되돌린다.
// 설정 시트와 입력창 안에서는 정상적으로 스크롤돼야 하므로 예외로 둔다.
document.addEventListener('touchmove', (e)=>{
  if(!isNotesSkin()) return;
  const t = e.target;
  if(t && t.closest && t.closest('.modal, .modal-card, input, textarea, [contenteditable]')) return;
  e.preventDefault();
}, { passive:false });

window.addEventListener('scroll', ()=>{
  if(window.scrollY !== 0) window.scrollTo(0, 0);
}, { passive:true });

// iOS가 화면을 밀어 올린 양(visualViewport.offsetTop)만큼 상단 바를 되밀어
// 메모 스킨 헤더가 항상 같은 자리에 있게 한다.
(function pinNotesHeader(){
  const vv = window.visualViewport;
  if(!vv) return;
  const sync = ()=> document.documentElement.style.setProperty('--vv-shift', Math.round(vv.offsetTop) + 'px');
  sync();
  vv.addEventListener('scroll', sync);
  vv.addEventListener('resize', sync);
})();

// 화면 실측: 하단 여백의 원인을 기기에서 바로 확인하기 위한 진단
function renderViewportDiag(){
  const el = document.getElementById('viewportDiag');
  if(!el) return;
  // env(safe-area-*) 실제 값은 임시 요소에 적용해 계산된 padding으로 읽는다
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;width:0;visibility:hidden;'
    + 'padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);';
  document.body.appendChild(probe);
  const cs = getComputedStyle(probe);
  const saTop = cs.paddingTop, saBot = cs.paddingBottom;
  probe.remove();

  const vv = window.visualViewport;
  const bodyH = Math.round(document.body.getBoundingClientRect().height);
  const dockBottom = Math.round(document.getElementById('dock').getBoundingClientRect().bottom);
  const standalone = document.documentElement.classList.contains('is-standalone');

  el.innerHTML = [
    '빌드&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' + BUILD,
    'screen&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' + screen.width + ' × ' + screen.height,
    'inner&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' + window.innerWidth + ' × ' + window.innerHeight,
    'visual&nbsp;&nbsp;&nbsp;&nbsp;' + (vv ? Math.round(vv.width) + ' × ' + Math.round(vv.height) : '없음'),
    'body h&nbsp;&nbsp;&nbsp;&nbsp;' + bodyH,
    'dock 하단 ' + dockBottom,
    'safe&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' + saTop + ' / ' + saBot,
    'standalone ' + (standalone ? 'yes' : 'no'),
    'standalone2 ' + (window.navigator.standalone === true ? 'yes' : 'no')
  ].join('<br>');
}

// 통합 런처로 이동
document.getElementById('gotoFaroBtn').onclick = ()=>{ location.href = './spectrum.html'; };
document.getElementById('gotoHomeBtn').onclick = ()=>{ location.href = './index.html?home=1'; };

// 홈 화면 실행(standalone)일 때만 안전영역 여백을 켠다.
// 브라우저 탭에서는 주소창/툴바가 이미 그 공간을 차지하므로 더하면 화면이 떠 보인다.
(function detectStandalone(){
  const mq = (typeof window.matchMedia === 'function')
    ? window.matchMedia('(display-mode: standalone)') : null;
  const on = ()=> (mq && mq.matches) || window.navigator.standalone === true;

  function sync(){
    const standalone = !!on();
    document.documentElement.classList.toggle('is-standalone', standalone);

  }

  sync();
  if(mq && mq.addEventListener) mq.addEventListener('change', sync);
  window.addEventListener('resize', sync);
  window.addEventListener('orientationchange', ()=> setTimeout(sync, 250));
})();

loadPersisted();
renderAll();
</script>
